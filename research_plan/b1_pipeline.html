<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>B1 Pipeline Editor</title>
  <style>
    :root { color-scheme: light; --ink:#17202a; --muted:#69727d; --surface:#fff; --canvas:#f3f5f6; --teal:#087f72; --yellow:#f5bd3f; --coral:#d94f3d; --blue:#2d6cdf; --border:#d5dce1; --danger:#b83232; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; background:var(--canvas); color:var(--ink); font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    button,input,select,textarea { font:inherit; }
    button,select,input[type="color"] { cursor:pointer; }
    .page { width:min(1720px,calc(100% - 32px)); margin:0 auto; padding:22px 0 26px; }
    header { display:flex; align-items:flex-end; justify-content:space-between; gap:24px; margin-bottom:16px; }
    .eyebrow { margin:0 0 5px; color:var(--teal); font-size:12px; font-weight:800; text-transform:uppercase; }
    h1 { margin:0; font-size:34px; line-height:1.05; }
    .legend { display:flex; flex-wrap:wrap; gap:16px; color:var(--muted); font-size:12px; }
    .legend span { display:inline-flex; align-items:center; gap:6px; }
    .dot { width:9px; height:9px; border-radius:50%; background:var(--teal); }
    .dot.file { background:var(--yellow); }
    .dot.deterministic { background:#7d8790; }
    .top-controls { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:10px; margin-bottom:12px; }
    .root-explorer,.editor-toolbar { display:flex; align-items:center; gap:8px; min-height:52px; padding:8px 10px; border:1px solid var(--border); border-radius:7px; background:var(--surface); box-shadow:0 4px 12px rgba(23,32,42,.05); }
    .root-explorer label,.field label { color:var(--muted); font-size:10px; font-weight:800; text-transform:uppercase; }
    .root-explorer input[type="text"] { width:100%; min-width:180px; height:34px; padding:0 9px; border:1px solid var(--border); border-radius:4px; background:#f8fafb; color:var(--ink); font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:11px; }
    button { min-height:34px; padding:0 11px; border:1px solid var(--border); border-radius:4px; background:#f8fafb; color:var(--ink); font-size:12px; font-weight:750; }
    button:hover:not(:disabled) { border-color:var(--teal); background:#f0f8f7; }
    button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible { outline:2px solid rgba(8,127,114,.28); outline-offset:1px; }
    button.primary { border-color:var(--teal); background:var(--teal); color:#fff; }
    button.danger { color:var(--danger); }
    button:disabled { cursor:default; opacity:.45; }
    .save-state { min-width:76px; color:var(--muted); font-size:11px; text-align:right; }
    .workspace { display:grid; grid-template-columns:minmax(0,1fr) 290px; gap:12px; align-items:start; }
    .pipeline-shell { min-width:0; height:calc(100vh - 190px); min-height:560px; overflow:auto; border:1px solid var(--border); border-radius:8px; background:var(--surface); box-shadow:0 10px 26px rgba(23,32,42,.08); }
    .pipeline { position:relative; width:1490px; min-height:2270px; background-color:#fbfcfc; background-image:radial-gradient(#cfd7dc .8px,transparent .8px); background-size:20px 20px; user-select:none; }
    .flow-lines,.node-layer,.edge-label-layer { position:absolute; inset:0; width:100%; height:100%; }
    .flow-lines { z-index:1; pointer-events:auto; }
    .node-layer { z-index:3; pointer-events:none; }
    .edge-label-layer { z-index:2; pointer-events:none; }
    .flow-lines path { fill:none; stroke-width:2; vector-effect:non-scaling-stroke; }
    .flow-lines path.dashed { stroke-dasharray:7 5; }
    .flow-lines path.edge-selected { stroke-width:4; }
    .flow-lines path.edge-hit { stroke:transparent; stroke-width:16; pointer-events:stroke; cursor:pointer; }
    .edge-label { position:absolute; max-width:150px; transform:translate(-50%,-50%); padding:3px 6px; border:1px solid var(--border); border-radius:4px; background:rgba(255,255,255,.94); color:var(--muted); font-size:9px; font-weight:800; line-height:1.2; text-align:center; text-transform:uppercase; }
    .node { position:absolute; display:block; min-height:112px; padding:15px; border:1px solid var(--border); border-left:5px solid var(--yellow); border-radius:7px; background:var(--node-color,var(--surface)); color:inherit; box-shadow:0 7px 18px rgba(23,32,42,.1); cursor:grab; pointer-events:auto; touch-action:none; }
    .node:hover { box-shadow:0 11px 24px rgba(23,32,42,.15); }
    .node.selected { outline:3px solid rgba(8,127,114,.45); outline-offset:2px; }
    .node.connection-source { outline:3px solid rgba(45,108,223,.55); outline-offset:2px; }
    .node.dragging { cursor:grabbing; box-shadow:0 16px 32px rgba(23,32,42,.2); }
    .node[data-kind="agent"] { min-height:184px; border:2px solid var(--teal); text-align:center; }
    .node[data-kind="deterministic"] { min-height:165px; border:2px solid #7d8790; text-align:center; }
    .node[data-kind="data"] { border-left-color:var(--blue); }
    .node[data-kind="prompt"] { min-height:68px; border-left-color:var(--teal); text-align:center; }
    .node.output { border-left-color:var(--coral); }
    .kind { display:block; margin-bottom:10px; color:var(--muted); font-size:9px; font-weight:800; text-transform:uppercase; }
    .node h2,.node h3 { margin:0; overflow-wrap:anywhere; }
    .node h2 { font-size:42px; line-height:1; }
    .node h3 { font-size:16px; line-height:1.25; }
    .node p { margin:9px 0 0; color:#4d5963; font-size:11px; line-height:1.4; }
    .filename { display:block; margin-top:8px; color:var(--muted); font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:9px; line-height:1.4; overflow-wrap:anywhere; user-select:text; }
    .details { margin:10px 0 0; padding:0; list-style:none; }
    .details li { padding:4px 0; border-top:1px solid rgba(105,114,125,.17); color:#4d5963; font-size:10px; }
    .open-file { min-height:26px; margin-top:10px; padding:0 7px; border-color:rgba(8,127,114,.4); background:rgba(255,255,255,.72); color:var(--teal); cursor:pointer; touch-action:auto; }
    .inspector { position:sticky; top:12px; padding:14px; border:1px solid var(--border); border-radius:8px; background:var(--surface); box-shadow:0 8px 20px rgba(23,32,42,.07); }
    .inspector h2 { margin:0 0 4px; font-size:16px; }
    .inspector-note { margin:0 0 13px; color:var(--muted); font-size:11px; line-height:1.4; }
    .inspector-empty { color:var(--muted); font-size:12px; line-height:1.5; }
    .fields[hidden],.inspector-empty[hidden] { display:none; }
    .field { display:grid; gap:5px; margin-top:11px; }
    .field-row { display:grid; grid-template-columns:1fr 72px; gap:9px; }
    .field input:not([type="color"]),.field select,.field textarea { width:100%; min-width:0; padding:7px 8px; border:1px solid var(--border); border-radius:4px; background:#fbfcfc; color:var(--ink); font-size:12px; }
    .field textarea { min-height:66px; resize:vertical; }
    .field input[type="color"] { width:100%; height:34px; padding:2px; border:1px solid var(--border); border-radius:4px; background:#fff; }
    .root-status { min-height:16px; margin:8px 2px 0; color:var(--muted); font-size:10px; }
    footer { margin-top:12px; color:var(--muted); font-size:11px; }
    footer a { color:var(--teal); text-decoration:none; }
    @media (max-width:980px) { .page{width:calc(100% - 20px);padding-top:14px} header{align-items:flex-start;flex-direction:column;gap:10px} .top-controls,.workspace{grid-template-columns:1fr} .editor-toolbar{flex-wrap:wrap} .pipeline-shell{height:65vh;min-height:480px} .inspector{position:static} }
    @media (max-width:620px) { .root-explorer{align-items:stretch;flex-wrap:wrap} .root-explorer label{width:100%} .root-explorer input[type="text"]{flex:1 1 100%} .save-state{flex:1} }
  </style>
</head>
<body>
  <main class="page">
    <header>
      <div><p class="eyebrow">B1 pipeline / Editor</p><h1>Steps A1 to A6</h1></div>
      <div class="legend" aria-label="Legend"><span><i class="dot file"></i> File or data</span><span><i class="dot"></i> Agent</span><span><i class="dot deterministic"></i> Deterministic step</span></div>
    </header>
    <div class="top-controls">
      <section class="root-explorer" aria-label="File root">
        <label for="file-root">File root</label><input id="file-root" type="text" value="/home/manuel/Documents/ehLang" autocomplete="off" spellcheck="false"><button id="browse-root" type="button">Browse</button><input id="folder-picker" type="file" webkitdirectory multiple hidden>
      </section>
      <nav class="editor-toolbar" aria-label="Graph editing tools">
        <button id="undo" type="button" title="Undo" disabled>Undo</button><button id="redo" type="button" title="Redo" disabled>Redo</button><button id="add-node" type="button" title="Add a node">+ Node</button><button id="connect-edge" type="button" title="Connect two nodes" aria-pressed="false">+ Arrow</button><button id="delete-node" class="danger" type="button" title="Delete the selection" disabled>Delete</button><button id="save-graph" class="primary" type="button" title="Save the pipeline">Save</button><span class="save-state" id="save-state" aria-live="polite">Loading...</span>
      </nav>
    </div>
    <div class="workspace">
      <div class="pipeline-shell" id="pipeline-shell"><section class="pipeline" id="pipeline" aria-label="Editable B1 pipeline graph"><svg class="flow-lines" id="flow-lines" aria-hidden="true"></svg><div class="edge-label-layer" id="edge-label-layer"></div><div class="node-layer" id="node-layer"></div></section></div>
      <aside class="inspector" aria-label="Selected node properties">
        <h2 id="inspector-title">Properties</h2><p class="inspector-note" id="inspector-note">Select a node or arrow to edit it.</p><p class="inspector-empty" id="inspector-empty">No selection.</p>
        <div class="fields" id="inspector-fields" hidden>
          <div class="field"><label for="node-title">Title</label><input id="node-title" type="text" maxlength="300"></div>
          <div class="field-row"><div class="field"><label for="node-kind">Type</label><select id="node-kind"><option value="file">File</option><option value="data">Data</option><option value="agent">Agent</option><option value="deterministic">Deterministic</option><option value="prompt">Prompt</option></select></div><div class="field"><label for="node-color">Color</label><input id="node-color" type="color"></div></div>
          <div class="field"><label for="node-role">Role</label><input id="node-role" type="text" maxlength="120"></div>
          <div class="field"><label for="node-path">Relative file path</label><input id="node-path" type="text" maxlength="1000" spellcheck="false"></div>
          <div class="field"><label for="node-description">Description</label><textarea id="node-description" maxlength="2000"></textarea></div>
          <div class="field"><label for="node-details">Details, one per line</label><textarea id="node-details"></textarea></div>
        </div>
        <div class="fields" id="edge-fields" hidden>
          <p class="inspector-note" id="edge-endpoints"></p>
          <div class="field"><label for="edge-label">Label</label><input id="edge-label" type="text" maxlength="200"></div>
          <div class="field-row"><div class="field"><label for="edge-style">Style</label><select id="edge-style"><option value="solid">Solid</option><option value="dashed">Dashed</option></select></div><div class="field"><label for="edge-color">Color</label><input id="edge-color" type="color"></div></div>
        </div>
        <p class="root-status" id="root-status" aria-live="polite">Using the default absolute root</p>
      </aside>
    </div>
    <footer>Source: <a href="file:///home/manuel/Documents/meetings_notes/261002_example_exec.md" target="_blank" rel="noopener">261002_example_exec.md</a></footer>
  </main>
  <script>
    (() => {
      "use strict";
      const API_PATH="/api/pipeline", defaultRoot="/home/manuel/Documents/ehLang";
      const pipeline=document.getElementById("pipeline"), shell=document.getElementById("pipeline-shell"), svg=document.getElementById("flow-lines"), nodeLayer=document.getElementById("node-layer"), edgeLabelLayer=document.getElementById("edge-label-layer"), saveState=document.getElementById("save-state"), saveButton=document.getElementById("save-graph"), addButton=document.getElementById("add-node"), connectButton=document.getElementById("connect-edge"), deleteButton=document.getElementById("delete-node"), undoButton=document.getElementById("undo"), redoButton=document.getElementById("redo"), rootInput=document.getElementById("file-root"), browseButton=document.getElementById("browse-root"), folderPicker=document.getElementById("folder-picker"), rootStatus=document.getElementById("root-status"), inspectorTitle=document.getElementById("inspector-title"), inspectorNote=document.getElementById("inspector-note"), inspectorEmpty=document.getElementById("inspector-empty"), inspectorFields=document.getElementById("inspector-fields"), edgeFields=document.getElementById("edge-fields"), edgeEndpoints=document.getElementById("edge-endpoints");
      const fields={title:document.getElementById("node-title"),kind:document.getElementById("node-kind"),color:document.getElementById("node-color"),role:document.getElementById("node-role"),path:document.getElementById("node-path"),description:document.getElementById("node-description"),details:document.getElementById("node-details")};
      const edgeControls={label:document.getElementById("edge-label"),style:document.getElementById("edge-style"),color:document.getElementById("edge-color")};
      let graph=null, selectedNodeId=null, selectedEdgeId=null, connectionSourceId=null, drag=null, dirty=false, connectMode=false;
      const history=[], future=[];
      const selectedFiles=new Map();
      const text=(tag,className,value)=>{const element=document.createElement(tag);if(className)element.className=className;element.textContent=value;return element};
      const svgElement=(name,attributes={})=>{const element=document.createElementNS("http://www.w3.org/2000/svg",name);Object.entries(attributes).forEach(([key,value])=>element.setAttribute(key,String(value)));return element};
      const normalizeRoot=value=>value.trim().replace(/\\/g,"/").replace(/\/+$/,"");
      const buildFileUrl=(root,path)=>{const base=normalizeRoot(root),suffix=path?"/"+path:"";if(base.startsWith("file://"))return encodeURI(base+suffix);return encodeURI((base.startsWith("/")?"file://":"file:///")+base+suffix)};
      const selectedNode=()=>graph?.nodes.find(node=>node.id===selectedNodeId)||null;
      const selectedEdge=()=>graph?.edges.find(edge=>edge.id===selectedEdgeId)||null;
      const setSaveState=(message,isError=false)=>{saveState.textContent=message;saveState.style.color=isError?"var(--danger)":""};
      const markDirty=()=>{dirty=true;setSaveState("Unsaved")};
      const isOutput=node=>/^Output\b/i.test(node.role);
      const snapshot=()=>JSON.stringify(graph);
      function updateHistoryButtons(){undoButton.disabled=!history.length;redoButton.disabled=!future.length}
      function pushHistory(value=snapshot()){history.push(value);if(history.length>50)history.shift();future.length=0;updateHistoryButtons()}
      function restoreGraph(source,destination){if(!source.length)return;destination.push(snapshot());graph=JSON.parse(source.pop());selectedNodeId=null;selectedEdgeId=null;cancelConnection(false);markDirty();renderGraph();updateHistoryButtons()}

      async function openNodeFile(node){if(!node.path)return;const file=selectedFiles.get(node.path);if(file){const url=URL.createObjectURL(file);window.open(url,"_blank","noopener");window.setTimeout(()=>URL.revokeObjectURL(url),60000);return}setSaveState("Opening file...");try{const response=await fetch("/api/open-file",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({root:normalizeRoot(rootInput.value),path:node.path})}),payload=await response.json();if(!response.ok)throw new Error(payload.error||"Could not open file.");setSaveState("File opened")}catch(error){setSaveState(error.message,true)}}
      function makeNode(node){
        const element=document.createElement("article");element.className="node"+(node.id===selectedNodeId?" selected":"")+(node.id===connectionSourceId?" connection-source":"")+(isOutput(node)?" output":"");element.dataset.id=node.id;element.dataset.kind=node.kind;element.style.left=node.x+"px";element.style.top=node.y+"px";element.style.width=node.width+"px";element.style.setProperty("--node-color",node.color);
        element.append(text("span","kind",node.role||node.kind),text(node.kind==="agent"||node.kind==="deterministic"?"h2":"h3","",node.title));
        if(node.description)element.append(text("p","",node.description));if(node.path)element.append(text("code","filename",node.path));
        if(node.details.length){const list=document.createElement("ul");list.className="details";node.details.forEach(detail=>list.append(text("li","",detail)));element.append(list)}
        if(node.path){const open=text("button","open-file","Open file");open.type="button";open.title="Open "+node.path;open.addEventListener("pointerdown",event=>event.stopPropagation());open.addEventListener("click",event=>{event.stopPropagation();openNodeFile(node)});element.append(open)}
        element.addEventListener("click",()=>connectMode?handleConnection(node.id):selectNode(node.id));element.addEventListener("pointerdown",startDrag);return element;
      }
      function renderNodes(){nodeLayer.replaceChildren(...graph.nodes.map(makeNode));window.requestAnimationFrame(renderEdges)}
      function renderEdges(){
        if(!graph)return;svg.setAttribute("viewBox",`0 0 ${graph.canvas.width} ${graph.canvas.height}`);const defs=svgElement("defs"),marker=svgElement("marker",{id:"arrow",markerWidth:9,markerHeight:9,refX:8,refY:4.5,orient:"auto"});marker.append(svgElement("path",{d:"M0,0 L9,4.5 L0,9 Z",fill:"#75838e"}));defs.append(marker);const paths=[defs],labels=[],byId=new Map(graph.nodes.map(node=>[node.id,node]));
        graph.edges.forEach(edge=>{const source=byId.get(edge.source),target=byId.get(edge.target),sourceElement=nodeLayer.querySelector(`[data-id="${CSS.escape(edge.source)}"]`),targetElement=nodeLayer.querySelector(`[data-id="${CSS.escape(edge.target)}"]`);if(!source||!target||!sourceElement||!targetElement)return;const leftToRight=source.x<=target.x,sx=leftToRight?source.x+source.width:source.x,tx=leftToRight?target.x:target.x+target.width,sy=source.y+sourceElement.offsetHeight/2,ty=target.y+targetElement.offsetHeight/2,curve=Math.max(70,Math.abs(tx-sx)*.45),direction=leftToRight?1:-1,pathData=`M${sx} ${sy} C${sx+curve*direction} ${sy}, ${tx-curve*direction} ${ty}, ${tx} ${ty}`,path=svgElement("path",{d:pathData,stroke:edge.color,"marker-end":"url(#arrow)"}),hit=svgElement("path",{d:pathData,class:"edge-hit"});if(edge.style==="dashed")path.classList.add("dashed");if(edge.id===selectedEdgeId)path.classList.add("edge-selected");hit.addEventListener("click",event=>{event.stopPropagation();selectEdge(edge.id)});paths.push(path,hit);if(edge.label){const label=text("span","edge-label",edge.label);label.style.left=(sx+tx)/2+"px";label.style.top=(sy+ty)/2+"px";labels.push(label)}});svg.replaceChildren(...paths);edgeLabelLayer.replaceChildren(...labels);
      }
      function renderInspector(){const node=selectedNode(),edge=selectedEdge();inspectorEmpty.hidden=Boolean(node||edge);inspectorFields.hidden=!node;edgeFields.hidden=!edge;deleteButton.disabled=!(node||edge);if(node){inspectorTitle.textContent="Node properties";inspectorNote.textContent="Drag the selected node directly on the canvas.";fields.title.value=node.title;fields.kind.value=node.kind;fields.color.value=node.color;fields.role.value=node.role;fields.path.value=node.path;fields.description.value=node.description;fields.details.value=node.details.join("\n")}else if(edge){inspectorTitle.textContent="Arrow properties";inspectorNote.textContent="Edit the selected arrow or delete it.";edgeEndpoints.textContent=`${edge.source} to ${edge.target}`;edgeControls.label.value=edge.label;edgeControls.style.value=edge.style;edgeControls.color.value=edge.color}else{inspectorTitle.textContent="Properties";inspectorNote.textContent="Select a node or arrow to edit it."}}
      function selectNode(id){selectedNodeId=id;selectedEdgeId=null;nodeLayer.querySelectorAll(".node").forEach(element=>element.classList.toggle("selected",element.dataset.id===id));renderEdges();renderInspector()}
      function selectEdge(id){selectedEdgeId=id;selectedNodeId=null;nodeLayer.querySelectorAll(".node").forEach(element=>element.classList.remove("selected"));renderEdges();renderInspector()}
      function renderGraph(){pipeline.style.width=graph.canvas.width+"px";pipeline.style.height=graph.canvas.height+"px";renderNodes();renderInspector()}
      function startDrag(event){if(connectMode||event.button!==0||event.target.closest("button"))return;const element=event.currentTarget,node=graph.nodes.find(item=>item.id===element.dataset.id);if(!node)return;selectNode(node.id);drag={node,element,pointerId:event.pointerId,startX:event.clientX,startY:event.clientY,nodeX:node.x,nodeY:node.y,moved:false,before:snapshot()};element.setPointerCapture(event.pointerId);element.classList.add("dragging");element.addEventListener("pointermove",moveDrag);element.addEventListener("pointerup",endDrag);element.addEventListener("pointercancel",endDrag);event.preventDefault()}
      function moveDrag(event){if(!drag||event.pointerId!==drag.pointerId)return;const dx=event.clientX-drag.startX,dy=event.clientY-drag.startY;if(Math.abs(dx)+Math.abs(dy)>2)drag.moved=true;drag.node.x=Math.round(Math.max(0,Math.min(graph.canvas.width-drag.node.width,drag.nodeX+dx)));drag.node.y=Math.round(Math.max(0,Math.min(graph.canvas.height-drag.element.offsetHeight,drag.nodeY+dy)));drag.element.style.left=drag.node.x+"px";drag.element.style.top=drag.node.y+"px";renderEdges()}
      function endDrag(event){if(!drag||event.pointerId!==drag.pointerId)return;drag.element.classList.remove("dragging");drag.element.removeEventListener("pointermove",moveDrag);drag.element.removeEventListener("pointerup",endDrag);drag.element.removeEventListener("pointercancel",endDrag);if(drag.moved){pushHistory(drag.before);markDirty()}drag=null}
      function updateSelected(property,value){const node=selectedNode();if(!node)return;pushHistory();node[property]=value;markDirty();renderNodes()}
      function updateSelectedEdge(property,value){const edge=selectedEdge();if(!edge)return;pushHistory();edge[property]=value;markDirty();renderEdges()}
      fields.title.addEventListener("input",()=>updateSelected("title",fields.title.value));fields.kind.addEventListener("change",()=>updateSelected("kind",fields.kind.value));fields.color.addEventListener("input",()=>updateSelected("color",fields.color.value));fields.role.addEventListener("input",()=>updateSelected("role",fields.role.value));fields.path.addEventListener("input",()=>updateSelected("path",fields.path.value));fields.description.addEventListener("input",()=>updateSelected("description",fields.description.value));fields.details.addEventListener("input",()=>updateSelected("details",fields.details.value.split("\n").map(item=>item.trim()).filter(Boolean)));
      edgeControls.label.addEventListener("input",()=>updateSelectedEdge("label",edgeControls.label.value));edgeControls.style.addEventListener("change",()=>updateSelectedEdge("style",edgeControls.style.value));edgeControls.color.addEventListener("input",()=>updateSelectedEdge("color",edgeControls.color.value));
      undoButton.addEventListener("click",()=>restoreGraph(history,future));redoButton.addEventListener("click",()=>restoreGraph(future,history));
      addButton.addEventListener("click",()=>{pushHistory();const id="node-"+Date.now().toString(36),node={id,kind:"file",title:"New node",role:"File",description:"",path:"",x:Math.min(graph.canvas.width-240,shell.scrollLeft+60),y:Math.min(graph.canvas.height-140,shell.scrollTop+60),width:240,color:"#ffffff",details:[]};graph.nodes.push(node);selectedNodeId=id;selectedEdgeId=null;markDirty();renderGraph()});
      function cancelConnection(resetStatus=true){connectMode=false;connectionSourceId=null;connectButton.setAttribute("aria-pressed","false");connectButton.textContent="+ Arrow";if(resetStatus)setSaveState(dirty?"Unsaved":"Saved");if(graph)renderNodes()}
      function handleConnection(nodeId){if(!connectionSourceId){connectionSourceId=nodeId;setSaveState("Select target");renderNodes();return}if(connectionSourceId===nodeId){setSaveState("Choose a different target",true);return}if(graph.edges.some(edge=>edge.source===connectionSourceId&&edge.target===nodeId)){setSaveState("Arrow already exists",true);return}pushHistory();const edge={id:"edge-"+Date.now().toString(36),source:connectionSourceId,target:nodeId,label:"",color:"#91a0ad",style:"solid"};graph.edges.push(edge);selectedEdgeId=edge.id;selectedNodeId=null;markDirty();cancelConnection(false);renderGraph()}
      connectButton.addEventListener("click",()=>{if(connectMode){cancelConnection();return}connectMode=true;selectedNodeId=null;selectedEdgeId=null;connectionSourceId=null;connectButton.setAttribute("aria-pressed","true");connectButton.textContent="Cancel arrow";setSaveState("Select source");renderGraph()});
      function deleteSelected(){if(!selectedNodeId&&!selectedEdgeId)return;pushHistory();if(selectedNodeId){graph.nodes=graph.nodes.filter(node=>node.id!==selectedNodeId);graph.edges=graph.edges.filter(edge=>edge.source!==selectedNodeId&&edge.target!==selectedNodeId)}else{graph.edges=graph.edges.filter(edge=>edge.id!==selectedEdgeId)}selectedNodeId=null;selectedEdgeId=null;markDirty();renderGraph()}
      deleteButton.addEventListener("click",deleteSelected);document.addEventListener("keydown",event=>{if(event.key==="Escape"&&connectMode){cancelConnection();return}if((event.key==="Delete"||event.key==="Backspace")&&(selectedNodeId||selectedEdgeId)&&!event.target.closest("input,textarea,select")){event.preventDefault();deleteSelected()}});
      saveButton.addEventListener("click",async()=>{saveButton.disabled=true;setSaveState("Saving...");try{const response=await fetch(API_PATH,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(graph)}),payload=await response.json();if(!response.ok)throw new Error(payload.error||"Save failed.");graph=payload;dirty=false;setSaveState("Saved");renderGraph()}catch(error){setSaveState(error.message,true)}finally{saveButton.disabled=false}});
      function applyRoot(value,persist=true){const root=normalizeRoot(value)||defaultRoot;rootInput.value=root;if(persist)localStorage.setItem("b1-file-root",root);selectedFiles.clear();rootStatus.textContent="Using absolute root: "+root}
      rootInput.addEventListener("change",()=>applyRoot(rootInput.value));rootInput.addEventListener("keydown",event=>{if(event.key==="Enter"){event.preventDefault();applyRoot(rootInput.value);rootInput.blur()}});browseButton.addEventListener("click",()=>folderPicker.click());folderPicker.addEventListener("change",()=>{selectedFiles.clear();const files=[...folderPicker.files];files.forEach(file=>{const parts=file.webkitRelativePath.split("/");selectedFiles.set(parts.slice(1).join("/"),file)});if(files.length){const folderName=files[0].webkitRelativePath.split("/")[0];rootStatus.textContent=`Selected folder: ${folderName} (${files.length} files)`}});
      window.addEventListener("beforeunload",event=>{if(!dirty)return;event.preventDefault();event.returnValue=""});
      async function loadGraph(){try{const response=await fetch(API_PATH,{cache:"no-store"}),payload=await response.json();if(!response.ok)throw new Error(payload.error||"Could not load the pipeline.");graph=payload;setSaveState("Saved");renderGraph()}catch(error){setSaveState(error.message,true);nodeLayer.append(text("p","inspector-empty","The pipeline could not be loaded. Start it with python3 pipeline_web.py."))}}
      applyRoot(localStorage.getItem("b1-file-root")||defaultRoot,false);loadGraph();
    })();
  </script>
</body>
